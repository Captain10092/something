<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark"></span><h1>Expense Tracker</h1></div>
    <select id="month" class="pill" aria-label="Month"></select>
  </header>

  <section class="hero" id="card-rem">
    <span class="label">Remaining this month</span>
    <b id="c-rem" class="big"></b>
    <div class="bar big"><i id="c-bar"></i></div>
    <div class="hero-meta">
      <div><span>Budget</span><b id="c-budget"></b></div>
      <div><span>Used</span><b id="c-used"></b></div>
      <div><span>Progress</span><b id="c-pct"></b></div>
    </div>
  </section>

  <p id="wealth" class="wealth"></p>
  <p id="alerts" class="alerts"></p>

  <div class="layout">
    <aside class="side">
      <section class="panel" id="add">
        <h2 id="form-title">Add expense</h2>
        <input id="quick" class="quick" placeholder="Quick add: Tea 20, then Enter" autocomplete="off">
        <div class="grid">
          <label>Amount (₹)<input id="f-amount" inputmode="numeric"></label>
          <label>Category<select id="f-category"></select></label>
          <label class="wide">Description<input id="f-description"></label>
          <label>Date<input id="f-date" type="date"></label>
          <label>Notes (optional)<input id="f-notes"></label>
        </div>
        <p id="form-err" class="err"></p>
        <div class="actions">
          <button id="save">Add expense</button>
          <button id="cancel" class="ghost" hidden>Cancel edit</button>
        </div>
      </section>
    </aside>

    <div class="main">
      <section>
        <h2 class="section-title">Categories</h2>
        <div id="cats" class="cats"></div>
      </section>

      <details class="panel budgets">
        <summary>Edit category budgets</summary>
        <div id="budget-form" class="grid"></div>
        <p id="budget-total" class="muted"></p>
        <button id="save-budgets">Save budgets</button>
      </details>

      <section class="panel">
        <h2>Transactions</h2>
        <div class="filters">
          <input id="q" placeholder="Search description">
          <select id="fc"><option value="">All categories</option></select>
          <input id="fd" type="date">
          <button id="clear" class="ghost">Clear</button>
        </div>
        <div class="scroll"><table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
      </section>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
